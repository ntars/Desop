[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desop-macos"
dynamic = ["version"]
description = "Desop - macOS-style desktop layer for Windows written in Python"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Ntarstudio", email = "contact@ntars.cn"}
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
    "Pillow>=10.0",
    "Jinja2>=3.0"
]

[project.scripts]
desop = "desop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desop*", "tests*"]

[tool.pytest.ini_options]
addopts = "-v --cov=desop --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["desop"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.pyinstaller]
hook-dirs = ["hooks"]
